name: gdpval-refresh

# Weekly GDPval-AA leaderboard check (Artificial Analysis' Elo eval on OpenAI's
# GDPval dataset). FREE — reads the public leaderboard page, because the Elo
# field in their Data API sits behind a paid key. That makes the path fragile by
# construction, so the script fails loud on any structural drift and this job
# proposes a PR rather than committing: a human eyeballs the numbers against the
# page before they reach the app. Elo is frozen per pool version, and a pool roll
# (v2 -> v3) fails the run instead of silently mixing incomparable scales.
# DISABLED 2026-08-24. Upstream stopped server-rendering full benchmark records for
# all but the ~30 displayed models, so the full Elo set this job needs is no longer on
# the page. The script correctly refuses to publish a 29-model leaderboard over the
# stored 192-model one, which means a daily schedule can only mail a red run every
# morning for a fault no run can fix. The stored 2026-08-15 snapshot is complete and
# the app is unaffected. Restore the cron once the data has a home again — see the
# header of scripts/gdpval-refresh.mjs.
on:
  # schedule:
  #   - cron: "50 14 * * *" # 14:50 UTC daily — after the other free feeds
  workflow_dispatch:

permissions:
  contents: write

# Shares the pool-write group with every other refresh job, so commits to main
# never race. These push directly now rather than opening a pull request, which
# makes the shared lock load-bearing rather than tidy.
concurrency:
  group: pool-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - id: gdpval
        name: Scrape the GDPval-AA leaderboard
        run: node scripts/gdpval-refresh.mjs

      # Auto-commit, not a pull request. See GOVERNANCE in the script header.
      - name: Commit the leaderboard update
        if: steps.gdpval.outputs.status == 'changes'
        run: |
          git config user.name "pool-refresh-bot"
          git config user.email "actions@github.com"
          git add data/gdpval/leaderboard.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "${{ steps.gdpval.outputs.title }}" -m "$(cat gdpval-refresh-report.md)"
            git pull --rebase origin main
            git push
          fi
