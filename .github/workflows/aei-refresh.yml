name: aei-refresh

# Weekly check of the Anthropic Economic Index (augment vs automate). FREE
# (public Hugging Face dataset, no key, no model). New dated releases are
# auto-detected via the HF API and appended to the trend; changes (and any
# schema change) are proposed as a PR for review.
on:
  schedule:
    - cron: "30 14 * * *" # 14:30 UTC daily
  workflow_dispatch:

permissions:
  contents: write

# Shares the pool-write group with every other refresh job, so commits to main
# never race. These push directly now rather than opening a pull request, which
# makes the shared lock load-bearing rather than tidy.
concurrency:
  group: pool-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: aei
        name: Fetch AEI augment/automate trend
        run: node scripts/aei-refresh.mjs

      # Auto-commit, not a pull request. See GOVERNANCE in the script header.
      - name: Commit the AEI update
        if: steps.aei.outputs.status == 'changes'
        run: |
          git config user.name "pool-refresh-bot"
          git config user.email "actions@github.com"
          git add data/aei/augmentation.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "${{ steps.aei.outputs.title }}" -m "$(cat aei-refresh-report.md)"
            git pull --rebase origin main
            git push
          fi
