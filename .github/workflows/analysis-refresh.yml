name: analysis-refresh

# The Analyst: a two-pass read of the dashboard's panels.
#
# Pass 1 is blind (current data + long-run history + news, no prior verdict) and
# picks AUGMENTATION or DISPLACEMENT — or CONFOUNDED with a named mechanism — plus a
# confidence and a pre-registered falsifier. Pass 2 sees pass 1 plus last run's
# verdict and numbers, and writes the what-changed narrative and the notification
# line; it cannot change the verdict, and disagreement is logged instead.
#
# CADENCE: weekly, skipped when nothing moved. The first-Friday monthly gate is
# retired — the run is now gated on the DATA rather than the calendar: the script
# hashes the input snapshot and exits without a paid call when that hash matches the
# last run's. Labor series only move monthly, but METR and GDPval move mid-month, so
# a real weekly change gets a real weekly run and a quiet week costs nothing.
#
# Every run APPENDS: data/analyst/dissent_log.json (the app's timeline) and
# data/analyst/runs.json (the audit record — both passes, usage, cost, input hash).
on:
  schedule:
    - cron: "0 13 * * 5" # 13:00 UTC Fridays (after the 08:30 ET BLS release window)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Assemble everything and print the request body; make NO model call"
        type: boolean
        default: false
      ab_run:
        description: "A/B: run the analyst on two models on one snapshot, report only, publish nothing"
        type: boolean
        default: false
      verify_series:
        description: "Verify candidate FRED series ids exist (space-separated). Reports only, writes nothing."
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: pool-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      notify: ${{ steps.analyst.outputs.notify }}
      notification_line: ${{ steps.analyst.outputs.notification_line }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ensure latest pool
        run: git pull --rebase origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Verify verdict derivation + registered-values parity (unit tests)
        run: node --test scripts/config.test.mjs scripts/analyst/*.test.mjs

      # FRED is unreachable from the maintainer's machine, so candidate series ids
      # are checked here rather than guessed and wired.
      - name: Verify candidate FRED series ids
        if: ${{ github.event.inputs.verify_series != '' }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/verify-series.mjs ${{ github.event.inputs.verify_series }}

      - name: Dry run (assemble everything, no model call)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: node scripts/analysis-refresh.mjs --dry-run

      # A/B: two models, one input snapshot, both at high effort. Publishes
      # nothing — it writes analyst-ab-report.json and uploads it for review.
      - name: A/B run (Sonnet 5 vs Opus 5)
        if: ${{ github.event.inputs.ab_run == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/analysis-refresh.mjs --ab
      - name: Upload the A/B report
        if: ${{ github.event.inputs.ab_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: analyst-ab-report
          path: analyst-ab-report.json

      # THIS STEP SPENDS MONEY. Every side mode has to be excluded here, and the
      # list must grow whenever a new one is added. A verify-only dispatch fired a
      # real paid run once because this condition named two of the three modes:
      # the missing one silently inherited "yes, also spend money".
      - name: Analyst (two-pass, high effort)
        id: analyst
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.ab_run != 'true' && github.event.inputs.verify_series == '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/analysis-refresh.mjs

      - name: Commit the pool + both append-only logs
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.ab_run != 'true' && github.event.inputs.verify_series == '' }}
        run: |
          git config user.name "pool-refresh-bot"
          git config user.email "actions@github.com"
          git add dashboard-data.json data/analyst/dissent_log.json data/analyst/runs.json data/analyst/runs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "analyst-refresh: new verdict"
            git pull --rebase origin main
            git push
          fi

  # Fires ONLY when the analyst actually appended a new verdict — the step output
  # is set inside the append path, so a data refresh or a skipped (nothing-moved)
  # run emits nothing.
  notify:
    needs: refresh
    if: ${{ needs.refresh.outputs.notify == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: The notification line
        run: |
          echo "New analysis published."
          echo "${{ needs.refresh.outputs.notification_line }}"
