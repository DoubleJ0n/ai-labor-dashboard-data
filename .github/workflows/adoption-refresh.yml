name: adoption-refresh

# Weekly Census BTOS AI-adoption check. FREE (keyless xlsx download) so it runs
# regardless of API credits. Proposes updates to the pinned snapshot as a PR;
# fails loud if the spreadsheet's structure changes (deterministic invariants),
# never silently mis-extracting.
on:
  schedule:
    - cron: "10 14 * * *" # 14:10 UTC daily
  workflow_dispatch:

permissions:
  contents: write

# Shares the pool-write group with every other refresh job, so commits to main
# never race. These push directly now rather than opening a pull request, which
# makes the shared lock load-bearing rather than tidy.
concurrency:
  group: pool-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - id: adoption
        name: Parse BTOS AI-use series
        run: node scripts/adoption-refresh.mjs

      # Auto-commit, not a pull request. See GOVERNANCE in the script header.
      - name: Commit the adoption update
        if: steps.adoption.outputs.status == 'changes'
        run: |
          git config user.name "pool-refresh-bot"
          git config user.email "actions@github.com"
          git add data/adoption/ai_adoption.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "${{ steps.adoption.outputs.title }}" -m "$(cat adoption-refresh-report.md)"
            git pull --rebase origin main
            git push
          fi
