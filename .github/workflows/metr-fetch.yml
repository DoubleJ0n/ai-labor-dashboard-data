name: metr-fetch

# Weekly METR Time Horizon check. FREE (METR's YAML feed, no API key) so it
# runs even when the Anthropic account has no credits. It PROPOSES changes as
# a pull request for human review — it never commits to the pinned snapshot
# directly. A methodology shift (new TH version) opens an issue and fails.
on:
  schedule:
    - cron: "40 14 * * *" # 14:40 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write # a methodology shift opens an issue and fails

# Shares the pool-write group with every other refresh job, so commits to main
# never race. These push directly now rather than opening a pull request, which
# makes the shared lock load-bearing rather than tidy.
concurrency:
  group: pool-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - id: metr
        name: Fetch + diff METR feed
        run: node scripts/metr-fetch.mjs

      # Auto-commit, not a pull request. See GOVERNANCE in the script header.
      - name: Commit new models and revisions
        if: steps.metr.outputs.status == 'changes'
        run: |
          git config user.name "pool-refresh-bot"
          git config user.email "actions@github.com"
          git add data/metr/time_horizons.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "${{ steps.metr.outputs.title }}" -m "$(cat metr-fetch-report.md)"
            git pull --rebase origin main
            git push
          fi
      - name: Open issue on methodology shift, then fail
        if: steps.metr.outputs.status == 'methodology'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "${{ steps.metr.outputs.title }}" \
            --body-file metr-fetch-report.md \
            --label needs-review
          echo "Methodology shift — stopping loudly." >&2
          exit 1
