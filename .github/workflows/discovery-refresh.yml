name: discovery-refresh

# Model-authored benchmark data is PROPOSED as a pull request for human
# review (audit-2026-07 finding 4 / C-3) — the same governance as
# METR/adoption/AEI. This workflow never commits to main.
# CADENCE: WEEKLY, AND DELIBERATELY NOT DAILY. This is the one scheduled job
# besides the analyst that spends money, and unlike the analyst it has no gate:
# the model call is the first thing it does, because the question it asks — has a
# tracked benchmark saturated and does it need a successor — can only be answered
# by going and looking at the web. There is no local input to hash and skip on.
#
# It was moved to daily along with the free data fetches, which was a mistake:
# benchmark saturation is a quarterly event at best, so six of every seven runs
# were paying to be told nothing had changed. Weekly is already generous.
on:
  schedule:
    - cron: "20 14 * * 1" # 14:20 UTC Mondays — paid and ungated, see above
  workflow_dispatch:

permissions:
  contents: write

# Shares the pool-write group with every other refresh job, so commits to main
# never race. These push directly now rather than opening a pull request, which
# makes the shared lock load-bearing rather than tidy.
concurrency:
  group: pool-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - id: discovery
        name: Discovery (Haiku 4.5 + web search)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/discovery-refresh.mjs

      # Auto-commit, not a pull request. See GOVERNANCE in the script header.
      - name: Commit the benchmark points
        if: steps.discovery.outputs.status == 'changes'
        run: |
          git config user.name "pool-refresh-bot"
          git config user.email "actions@github.com"
          git add dashboard-data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "${{ steps.discovery.outputs.title }}" -m "$(cat discovery-report.md)"
            git pull --rebase origin main
            git push
          fi
